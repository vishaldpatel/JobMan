<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JobMan</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --border: #d0d0d0;
    --muted: #666;
  }
  body {
    font-family: system-ui, sans-serif;
    margin: 2rem;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  button {
    font-size: 0.95rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  #status {
    color: var(--muted);
    font-size: 0.9rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.7rem;
    text-align: left;
    font-size: 0.9rem;
    vertical-align: top;
  }
  th {
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: Canvas;
  }
  th:hover {
    background: color-mix(in srgb, Canvas 90%, CanvasText);
  }
  td.description {
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  td.description.expanded {
    white-space: normal;
  }
  a {
    color: inherit;
  }
  td.expand-toggle {
    width: 1.5rem;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  tr.detail-row td {
    background: color-mix(in srgb, Canvas 95%, CanvasText);
  }
  dl.detail-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.3rem 1rem;
    margin: 0;
  }
  dl.detail-grid dt {
    font-weight: 600;
    color: var(--muted);
  }
  dl.detail-grid dd {
    margin: 0;
    white-space: pre-wrap;
  }
  .description-block {
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .description-block h4 {
    margin: 0 0 0.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .description-html {
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 70ch;
  }
  .description-html :first-child {
    margin-top: 0;
  }
  .description-html :last-child {
    margin-bottom: 0;
  }
  .description-html ul, .description-html ol {
    padding-left: 1.3rem;
  }
  .description-html h1, .description-html h2, .description-html h3 {
    font-size: 1rem;
    margin: 0.8rem 0 0.3rem;
  }
</style>
</head>
<body>
<header>
  <h1>JobMan</h1>
  <button id="scrape-btn">Scrape today's jobs</button>
  <span id="status"></span>
</header>

<table id="jobs-table">
  <thead>
    <tr id="header-row"></tr>
  </thead>
  <tbody id="jobs-body"></tbody>
</table>

<script>
const COLUMNS = [
  { key: "title", label: "Title" },
  { key: "company", label: "Company" },
  { key: "location", label: "Location" },
  { key: "is_remote", label: "Remote" },
  { key: "job_type", label: "Type" },
  { key: "min_amount", label: "Min $" },
  { key: "max_amount", label: "Max $" },
  { key: "date_posted", label: "Posted" },
  { key: "description", label: "Description" },
];

// Fields already shown as their own table column, or used internally, so
// they're skipped when rendering the "extra details" panel for a row.
const MAIN_FIELD_KEYS = new Set([
  "title", "company", "location", "is_remote", "job_type",
  "min_amount", "max_amount", "date_posted", "description",
  "job_url", "job_url_direct",
]);

let jobs = [];
let sortKey = null;
let sortAsc = true;
let expandedKeys = new Set();
let expandedDescKeys = new Set();

function jobKey(job) {
  return job.job_url || job.job_url_direct || JSON.stringify(job);
}

function formatLabel(key) {
  return key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

// Strips common markdown syntax down to plain text for the compact table preview.
function stripMarkdown(text) {
  return text
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/[*_`>#-]/g, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
}

const statusEl = document.getElementById("status");
const bodyEl = document.getElementById("jobs-body");
const headerRowEl = document.getElementById("header-row");
const scrapeBtn = document.getElementById("scrape-btn");

function renderHeader() {
  headerRowEl.innerHTML = "";
  headerRowEl.appendChild(document.createElement("th"));
  for (const col of COLUMNS) {
    const th = document.createElement("th");
    th.textContent = col.label + (sortKey === col.key ? (sortAsc ? " ▲" : " ▼") : "");
    th.addEventListener("click", () => {
      if (sortKey === col.key) {
        sortAsc = !sortAsc;
      } else {
        sortKey = col.key;
        sortAsc = true;
      }
      renderHeader();
      renderRows();
    });
    headerRowEl.appendChild(th);
  }
}

function renderRows() {
  let rows = [...jobs];
  if (sortKey) {
    rows.sort((a, b) => {
      const av = a[sortKey];
      const bv = b[sortKey];
      if (av == null) return 1;
      if (bv == null) return -1;
      if (av < bv) return sortAsc ? -1 : 1;
      if (av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  bodyEl.innerHTML = "";
  for (const job of rows) {
    const key = jobKey(job);
    const isExpanded = expandedKeys.has(key);

    const tr = document.createElement("tr");

    const toggleTd = document.createElement("td");
    toggleTd.className = "expand-toggle";
    toggleTd.textContent = isExpanded ? "▼" : "▸";
    toggleTd.addEventListener("click", () => {
      if (expandedKeys.has(key)) {
        expandedKeys.delete(key);
      } else {
        expandedKeys.add(key);
      }
      renderRows();
    });
    tr.appendChild(toggleTd);

    for (const col of COLUMNS) {
      const td = document.createElement("td");
      const value = job[col.key];
      if (col.key === "description") {
        td.className = "description" + (expandedDescKeys.has(key) ? " expanded" : "");
        td.textContent = value ? stripMarkdown(value) : "";
        td.addEventListener("dblclick", () => {
          if (expandedDescKeys.has(key)) {
            expandedDescKeys.delete(key);
          } else {
            expandedDescKeys.add(key);
          }
          renderRows();
        });
      } else if (col.key === "title") {
        const externalUrl = job.job_url_direct || job.job_url;
        if (externalUrl) {
          const a = document.createElement("a");
          a.href = externalUrl;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = value ?? "";
          td.appendChild(a);
        } else {
          td.textContent = value ?? "";
        }
      } else {
        td.textContent = value ?? "";
      }
      tr.appendChild(td);
    }
    bodyEl.appendChild(tr);

    if (isExpanded) {
      const detailTr = document.createElement("tr");
      detailTr.className = "detail-row";
      const detailTd = document.createElement("td");
      detailTd.colSpan = COLUMNS.length + 1;

      if (job.description) {
        const descBlock = document.createElement("div");
        descBlock.className = "description-block";
        const heading = document.createElement("h4");
        heading.textContent = "Description";
        const descHtml = document.createElement("div");
        descHtml.className = "description-html";
        descHtml.innerHTML = marked.parse(job.description);
        descBlock.appendChild(heading);
        descBlock.appendChild(descHtml);
        detailTd.appendChild(descBlock);
      }

      const dl = document.createElement("dl");
      dl.className = "detail-grid";
      const extraKeys = Object.keys(job).filter(
        (k) => !MAIN_FIELD_KEYS.has(k) && job[k] != null && job[k] !== ""
      );
      if (extraKeys.length === 0 && !job.description) {
        detailTd.textContent = "No additional details available.";
      } else {
        for (const k of extraKeys) {
          const dt = document.createElement("dt");
          dt.textContent = formatLabel(k);
          const dd = document.createElement("dd");
          dd.textContent = job[k];
          dl.appendChild(dt);
          dl.appendChild(dd);
        }
        detailTd.appendChild(dl);
      }
      detailTr.appendChild(detailTd);
      bodyEl.appendChild(detailTr);
    }
  }
}

async function loadJobs() {
  const res = await fetch("/api/jobs");
  const data = await res.json();
  jobs = data.jobs;
  statusEl.textContent = `${data.count} job(s) loaded`;
  renderRows();
}

async function triggerScrape() {
  scrapeBtn.disabled = true;
  statusEl.textContent = "Scraping… this can take a minute";
  try {
    const res = await fetch("/api/scrape", { method: "POST" });
    const data = await res.json();
    jobs = data.jobs;
    statusEl.textContent = `${data.count} job(s) found`;
    renderRows();
  } catch (err) {
    statusEl.textContent = "Scrape failed: " + err;
  } finally {
    scrapeBtn.disabled = false;
  }
}

scrapeBtn.addEventListener("click", triggerScrape);

renderHeader();
loadJobs();
</script>
</body>
</html>
